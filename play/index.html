<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>House Party</title>
</head>
<body class="phone">
<h1>House Party</h1>
<form id="join-form" autocomplete="off">
  <label for="room-input">Room code</label>
  <input id="room-input" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false" />
  <label for="name-input">Your name</label>
  <input id="name-input" maxlength="30" />
  <div id="error" class="error" role="alert"></div>
  <button id="join-btn" type="submit">Join</button>
</form>
<main id="room-view" hidden>
  <p><span id="status">Connecting</span> as <strong id="you-name"></strong> (<span id="role"></span>)</p>
  <div class="row">
    <button id="tilt-btn" class="ghost" type="button">Enable tilt</button>
    <span id="tilt-status"></span>
  </div>
  <section id="picker" hidden>
    <h2>Pick a game</h2>
    <div id="picker-list"></div>
  </section>
  <section id="game-bar" hidden><button id="end-game" class="ghost" type="button">End game</button></section>
  <section id="game-root"></section>
  <h3>In the room</h3>
  <ul id="players-list"></ul>
  <button id="leave-btn" class="ghost" type="button">Leave room</button>
</main>
<script type="module" src="../web/play/main.ts"></script>
</body>
</html>
